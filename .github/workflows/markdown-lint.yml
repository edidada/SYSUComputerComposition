name: Markdown Lint

on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: markdown-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Lint Markdown docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Use the project's existing config (disables MD033/MD024, enables the rest).
          config: '.markdownlint.json'
          # Lint every Markdown file anywhere in the repo (default only scans the root dir).
          globs: '**/*.md'
